name: Build and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uwb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  PYTHONUTF8: '1'

jobs:
  verify:
    name: Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test release tooling
        run: python -m unittest discover -s tests/python -v
      - name: Test shared engine code
        run: dotnet test src/VoltstroStudios.UnityWebBrowser.Tests/VoltstroStudios.UnityWebBrowser.Tests.csproj -c Release
      - name: Compile native process probe and check layouts
        run: dotnet run --project tests/WindowsProcessProbe/WindowsProcessProbe.csproj -c Release --property:TreatWarningsAsErrors=true

  packages:
    name: Unity packages
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build the shared DLL used by Unity
        run: dotnet build src/VoltstroStudios.UnityWebBrowser.Shared/VoltstroStudios.UnityWebBrowser.Shared.csproj -c ReleaseUnity -f netstandard2.1
      - name: Pack core, CEF integration and optional pipes packages
        run: python ci/release_tools.py pack --target core --output artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uwb-package-core
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  engines:
    name: CEF ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            runner: windows-2022
            script: windows64
          - target: linux-x64
            runner: ubuntu-22.04
            script: linux64
          - target: osx-x64
            runner: macos-15-intel
            script: macosx64
          - target: osx-arm64
            runner: macos-15
            script: macosarm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Linux Native AOT prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev
      - name: Download the pinned CEF bundle and verify its checksum
        run: python src/DevScripts/download_cef_${{ matrix.script }}.py
      - name: Build the Native AOT engine
        run: python src/DevScripts/build_cef_${{ matrix.script }}.py
      - name: Run Windows process regression checks
        if: runner.os == 'Windows'
        run: dotnet run --project tests/WindowsProcessProbe/WindowsProcessProbe.csproj -c Release --property:TreatWarningsAsErrors=true
      - name: Verify native architecture, smoke-test and package
        run: python ci/release_tools.py pack --target ${{ matrix.target }} --output artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uwb-package-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  assemble:
    name: Verify release assets
    needs: [packages, engines]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: uwb-package-*
          merge-multiple: true
          path: artifacts
      - name: Require all seven packages and generate SHA-256 checksums
        run: python ci/release_tools.py assemble --output artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uwb-release
          path: |
            artifacts/*.tgz
            artifacts/SHA256SUMS
            artifacts/release-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: assemble
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: uwb-release
          path: artifacts
      - name: Publish only a complete, verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python ci/publish_release.py --directory artifacts --tag "$RELEASE_TAG"
